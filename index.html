function fit(a, T, fx) {
    const g = {
        P: 0,
        C: 0,
        V: a.V ? fx.v : 0,
        X: a.X ? fx.x : 0,
        F: 0
    };

    const R = Object.keys(g);

    const tot = m => R.reduce((s, r) => {
        if (!a[r]) return s;

        return s + (Number(a[r][m]) || 0) * g[r] / 100;
    }, 0);

    const cl = (v, r) => {
        const [lo, hi] = RG(a[r], r);
        return Math.min(hi, Math.max(lo, v));
    };

    // Ajustar proteínas, hidratos y grasas.
    for (let i = 0; i < 5; i++) {
        if (a.P && (Number(a.P.p) || 0) > 0) {
            g.P = cl(
                (T.p - (tot("p") - a.P.p * g.P / 100))
                * 100 / a.P.p,
                "P"
            );
        }

        if (a.C && (Number(a.C.h) || 0) > 0) {
            g.C = cl(
                (T.h - (tot("h") - a.C.h * g.C / 100))
                * 100 / a.C.h,
                "C"
            );
        }

        if (a.F && (Number(a.F.f) || 0) > 0) {
            g.F = cl(
                (T.f - (tot("f") - a.F.f * g.F / 100))
                * 100 / a.F.f,
                "F"
            );
        }
    }

    // Ajustar las calorías.
    let e = T.k - tot("k");

    if (a.C && (Number(a.C.k) || 0) > 0) {
        g.C = cl(
            g.C + e / a.C.k * 100,
            "C"
        );

        e = T.k - tot("k");
    }

    if (
        a.F &&
        (Number(a.F.k) || 0) > 0 &&
        Math.abs(e) > 15
    ) {
        g.F = cl(
            g.F + e / a.F.k * 100,
            "F"
        );
    }

    // Redondear las cantidades de los ingredientes.
    R.forEach(r => {
        if (!a[r]) return;

        const u =
            a[r].n === "Huevo entero" ? 60 :
            a[r].n === "Claras de huevo" ? 30 :
            5;

        g[r] = Math.max(
            u,
            Math.round(g[r] / u) * u
        );
    });

    return g;
}

if(ty=='m'&&usable(MS)){st=MS}else{const L=ty=='b'?BS:SS,ok=L.map((s,i)=>i).filter(i=>usable(L[i])),alt=ok.filter(i=>i!=ctx.ls[nm]),cand=alt.length?alt:ok;if(cand.length){const i=cand[Math.floor(rng()*cand.length)];ctx.ls[nm]=i;st=L[i]}else st=FB}
for(const r of ['P','C','V','X','F'])if(st[r])a[r]=pick(poolOf(st,r),ty+r,ctx,day,r=='P'?3:2,rng);
if(st===MS){const m=MTH[a.P.c];mth=m[Math.floor(rng()*m.length)];title=`${dn(a.P.n)} ${mth} con ${lw(a.C)} y ${lw(a.V)}`;const sa=SAU.filter(OKS);sauce=sa[Math.floor(rng()*sa.length)][0]}else title=st.T(a);
const g=fit(a,{k:T.k,p:T.p,h:T.c,f:T.f},{v:ty=='m'?170:ty=='b'?80:60,x:ty=='b'?130:100}),ing=[];let k=0,p=0,c=0,f=0;
for(const r of ['P','C','V','X','F'])if(a[r]&&g[r]>0){const x=a[r],q=g[r]/100,o={n:x.n,cl:x.c,g:g[r],k:+(x.k*q).toFixed(1),p:+(x.p*q).toFixed(1),h:+(x.h*q).toFixed(1),f:+(x.f*q).toFixed(1)};ing.push(o);k+=o.k;p+=o.p;c+=o.h;f+=o.f}
return{slot:nm,ty,title:title[0].toUpperCase()+title.slice(1),sauce,ing,k:Math.round(k),p:Math.round(p),c:Math.round(c),f:Math.round(f)}}
const tg=(t,sh)=>({k:t.k*sh,p:t.p*sh,c:t.c*sh,f:t.f*sh});
function genPlan(seed){const t=tgt(P),ctx={last:{},ls:{}},rng=rnd(seed),days=[];for(let d=0;d<P.weeks*7;d++)days.push({meals:SL[P.meals].map(sl=>genMeal(sl,tg(t,sl[2]),ctx,d,rng))});return{seed,t,days,at:Date.now()}}
function swap(d,m){const sl=SL[P.meals][m],ctx={last:{},ls:{}};PLAN.days.forEach((dy,i)=>dy.meals.forEach(ml=>ml.ing.forEach(x=>{if(i!=d||ml!==PLAN.days[d].meals[m])ctx.last[ml.ty+(x.cl=='A'||'PMHTL'.includes(x.cl)?'P':x.cl=='G'?'C':x.cl=='V'?'V':x.cl=='F'?'X':'F')+x.n]=i})));
PLAN.days[d].meals[m]=genMeal(sl,tg(PLAN.t,sl[2]),ctx,d,rnd(Date.now()%1e9));sv();render()}

function swapDay(d) {
    if (!PLAN || !PLAN.days[d]) return;

    const ctx = {
        last: {},
        ls: {}
    };

    const rng = rnd(Date.now() % 1e9);

    PLAN.days[d].meals = SL[P.meals].map(sl => {
        return genMeal(
            sl,
            tg(PLAN.t, sl[2]),
            ctx,
            d,
            rng
        );
    });

    sv();
    render();
}

function combos(){const u=(st,r)=>new Set(poolOf(st,r).map(f=>f.n)).size,sa=SAU.filter(OKS).length;let mainN=0;if(usable(MS)){const o=u(MS,'C')*u(MS,'V')*u(MS,'F');poolOf(MS,'P').forEach(p=>mainN+=MTH[p.c].length*o*sa)}
const c=st=>usable(st)?['P','C','V','X','F'].reduce((n,r)=>st[r]?n*u(st,r):n,1):0,bN=BS.reduce((s,x)=>s+c(x),0),sN=SS.reduce((s,x)=>s+c(x),0),sl=SL[P.meals],cnt=ty=>sl.filter(x=>x[1]==ty).length,lg=(n,k)=>n>1?k*Math.log10(n):0;return{mainN,bN,sN,log:7*(lg(mainN,cnt('m'))+lg(bN,cnt('b'))+lg(sN,cnt('s')))}}
const fm=n=>n>=1e6?(n/1e6).toFixed(1)+' M':n>=1e3?Math.round(n/1e3)+' mil':String(n);
/* ---- interfaz ---- */
const op=(a,v)=>a.map(([k,t])=>`<option value="${k}"${k==v?' selected':''}>${t}</option>`).join(''),sl=(k,a,l)=>`<label>${l}<select onchange="cf('${k}',this.value)">${op(a,P[k])}</select></label>`;
function cf(k,v){P[k]=['age','w','h','act','rate','meals','weeks'].includes(k)?+v:v;sv()}
function tx(ex){P.ex[ex]=!P.ex[ex];sv();render()}
function vPf(){const t=tgt(P),cb=combos(),IN=[['g','Gluten'],['d','Lácteos/lactosa'],['n','Frutos secos/cacahuete'],['e','Huevo'],['f','Pescado'],['s','Marisco'],['y','Soja']];
return`<div class=card><h3>Tu perfil</h3><div class=g2>${sl('sex',[['m','Hombre'],['f','Mujer']],'Sexo')}<label>Edad<input type=number inputmode=numeric value=${P.age} onchange="cf('age',this.value)"></label><label>Peso (kg)<input type=number inputmode=decimal value=${P.w} onchange="cf('w',this.value)"></label><label>Altura (cm)<input type=number inputmode=numeric value=${P.h} onchange="cf('h',this.value)"></label></div>${sl('act',[[1.2,'Sedentario'],[1.375,'Ligero (1–3 días)'],[1.55,'Moderado (3–5 días)'],[1.725,'Alto (6–7 días)'],[1.9,'Muy alto (doble sesión/trabajo físico)']],'Actividad')}<div class=g2>${sl('goal',Object.entries(GL),'Objetivo')}${sl('rate',[[0,'Suave'],[1,'Normal'],[2,'Rápido']],'Ritmo')}</div></div>
<div class=card><h3>Dieta</h3><div class=g2>${sl('diet',[['omni','Omnívora'],['pesc','Pescetariana'],['veg','Vegetariana'],['vegan','Vegana']],'Tipo')}${sl('meals',[3,4,5,6].map(n=>[n,n+' comidas']),'Comidas/día')}</div>${sl('weeks',[1,2,3,4].map(n=>[n,n+(n==1?' semana':' semanas')]),'Duración del plan')}<label>Excluir (alergias/intolerancias)</label><div class=chips>${IN.map(([k,n])=>`<button class="chip${P.ex[k]?' on':''}" onclick="tx('${k}')">${n}</button>`).join('')}</div><label>No me gustan (separados por comas)<input value="${esc(P.dis)}" placeholder="brócoli, atún" onchange="P.dis=this.value;sv()"></label><p class=m>Filtramos por etiqueta de ingrediente; revisa siempre las etiquetas reales y consulta a un profesional si tienes alergias graves.</p></div>
<div class=card><h3>Tu objetivo</h3><div class=st><div><b>${t.k}</b><span>KCAL</span></div><div><b>${t.p}</b><span>PROT. g</span></div><div><b>${t.c}</b><span>HIDR. g</span></div><div><b>${t.f}</b><span>GRASA g</span></div></div><p class=m>Metabolismo basal ${t.bmr} kcal · gasto estimado ${t.tdee} kcal (fórmula Mifflin-St Jeor). Estimaciones orientativas.</p>${t.notes.map(n=>`<p class=pr>${n}</p>`).join('')}</div>
<div class=card><h3>Variedad con tu perfil</h3><p>≈ <b>${fm(cb.mainN)}</b> comidas principales distintas · <b>${fm(cb.bN)}</b> desayunos · <b>${fm(cb.sN)}</b> snacks. Semanas distintas posibles: <b>10<sup>${Math.floor(cb.log)}</sup></b>.</p><p class=m>Son combinaciones de ${FD.length} alimentos, técnicas de cocinado y salsas, generadas por el programa, no un catálogo de recetas escritas a mano.</p></div>
<button class=btn onclick="gen()">GENERAR DIETA</button><p class=m>Orientativo: no sustituye a un dietista ni a un médico. No usar con embarazo, trastornos de la conducta alimentaria o patologías sin supervisión profesional.</p>`}
function gen(){const e=validate(P);if(e)return toast(e);PLAN=genPlan(Date.now()%1e9);S.tab=1;S.wk=0;S.chk={};sv();render();toast('Dieta generada')}
const dt=d=>d.meals.reduce((a,m)=>({k:a.k+m.k,p:a.p+m.p,c:a.c+m.c,f:a.f+m.f}),{k:0,p:0,c:0,f:0});
const ingL=x=>x.n=='Huevo entero'?`${x.g/60} huevos (${x.g} g)`:`${x.g} g de ${dn(x.n).toLowerCase()}`;
function vPl(){if(!PLAN)return`<div class=card>Aún no hay dieta. Rellena tu perfil y pulsa GENERAR DIETA.</div>`;const W=PLAN.days.length/7,t=PLAN.t;let h=`<div class=card><h3>Plan · ${GL[P.goal]}</h3><p class=m>Objetivo diario: ${t.k} kcal · P ${t.p} · C ${t.c} · G ${t.f}</p>${t.notes.map(n=>`<p class=pr>${n}</p>`).join('')}`;
if(W>1){h+='<div class=chips>';for(let i=0;i<W;i++)h+=`<button class="chip${S.wk==i?' on':''}" onclick="S.wk=${i};render()">Semana ${i+1}</button>`;h+='</div>'}h+=`<button class="btn g" onclick="gen()">REGENERAR TODO</button></div>`;
for(let d=S.wk*7;d<S.wk*7+7&&d<PLAN.days.length;d++){const dy=PLAN.days[d],s=dt(dy);h+=`<div class=card><div class=hd><h3>Día ${d+1}</h3><button class="btn g t" onclick="swapDay(${d})">CAMBIAR DÍA</button></div><p class=m><b style="color:#fff">${s.k}</b> kcal · P ${s.p} · C ${s.c} · G ${s.f}</p>`;
dy.meals.forEach((m,i)=>{h+=`<div class=ml><div class=hd><small>${m.slot.toUpperCase()} · ${m.k} kcal</small><button class="btn g t" onclick="swap(${d},${i})">CAMBIAR</button></div><b>${esc(m.title)}</b><ul>${m.ing.map(x=>`<li>${esc(ingL(x))}</li>`).join('')}</ul>${m.sauce?`<small>Salsa/aliño: ${esc(m.sauce)}</small><br>`:''}<small>P ${m.p} · C ${m.c} · G ${m.f}</small></div>`});h+='</div>'}return h}
const CAT={A:'Carne y pescado',P:'Carne y pescado',M:'Carne y pescado',H:'Huevos y lácteos',D:'Huevos y lácteos',W:'Despensa y grasas',V:'Verduras',F:'Frutas',G:'Cereales y legumbres',L:'Cereales y legumbres',O:'Despensa y grasas',T:'Despensa y grasas'};
function shop(wk){const m={};PLAN.days.slice(wk*7,wk*7+7).forEach(d=>d.meals.forEach(ml=>ml.ing.forEach(x=>{m[x.n]=m[x.n]||{n:x.n,cl:x.cl,g:0};m[x.n].g+=x.g})));const o={};Object.values(m).sort((a,b)=>a.n<b.n?-1:1).forEach(x=>(o[CAT[x.cl]]=o[CAT[x.cl]]||[]).push(x));return o}
const qty=x=>x.n=='Huevo entero'?`${x.g/60} huevos`:x.g>=1000?(x.g/1000).toFixed(2)+' kg':x.g+' g';
function vCo(){if(!PLAN)return`<div class=card>Genera primero una dieta.</div>`;const W=PLAN.days.length/7;let h='';if(W>1){h+='<div class=chips>';for(let i=0;i<W;i++)h+=`<button class="chip${S.wk==i?' on':''}" onclick="S.wk=${i};render()">Semana ${i+1}</button>`;h+='</div>'}
const o=shop(S.wk);for(const c in o){h+=`<div class=card><h3>${c}</h3>${o[c].map(x=>{const k=S.wk+x.n,d=S.chk[k];return`<label class="it${d?' dn':''}" style="margin:0;color:var(--tx);text-transform:none;font-size:15px;letter-spacing:0"><input type=checkbox${d?' checked':''} onchange="S.chk['${k.replace(/'/g,"\\'")}']=this.checked;sv();render()"><span style="flex:1">${esc(dn(x.n))}</span><b>${qty(x)}</b></label>`}).join('')}</div>`}return h+`<p class=m>Pesos en crudo o seco, tal como aparecen en el plan. Las salsas y especias no se cuentan.</p>`}
function vAl(){const q=norm(S.q||'');const L=FD.filter(f=>!q||norm(f.n).includes(q)).slice(0,60);return`<div class=card><label>Buscar alimento (${FD.length} en la base)<input value="${esc(S.q||'')}" onchange="S.q=this.value;render()"></label><table style="width:100%;font-size:13px;border-collapse:collapse"><tr><th align=left>Por 100 g</th><th>kcal</th><th>P</th><th>C</th><th>G</th></tr>${L.map(f=>`<tr style="border-top:1px solid var(--ln)"><td style="padding:6px 0">${esc(f.n)}</td><td align=center>${f.k}</td><td align=center>${f.p}</td><td align=center>${f.h}</td><td align=center>${f.f}</td></tr>`).join('')}</table><p class=m>Valores medios orientativos (cocinados o crudos según el alimento).</p></div>`}
function vEx(){return`<div class=card><h3>Exportar</h3><button class=btn onclick="xp('pdf')">DIETA EN PDF</button><button class="btn g" onclick="xp('csv')">HOJA EDITABLE (CSV)</button><button class="btn g" onclick="xp('json')">COPIA (JSON)</button><label>Importar copia JSON<input type=file accept=".json,application/json" onchange="im(this)"></label><p class=m>Gratis y sin cuenta. Todo se guarda solo en este dispositivo.</p></div>`}
function dl(f,d){const u=URL.createObjectURL(new Blob([d],{type:f.endsWith('.pdf')?'application/pdf':'text/plain'})),a=document.createElement('a');a.href=u;a.download=f;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},5000);toast('Archivo listo')}
async function im(i){try{const j=JSON.parse(await i.files[0].text());if(!j.p||!j.plan||!Array.isArray(j.plan.days))throw 0;P=Object.assign({},DEF,j.p);P.ex=P.ex||{};PLAN=j.plan;sv();S.tab=1;render();toast('Importado')}catch(e){toast('Archivo no válido')}}
const en=t=>String(t).replace(/[—–−]/g,'-').replace(/[^\x20-\xFF]/g,'?').replace(/([\\()])/g,'\\$1');
function pdfL(){const t=PLAN.t,L=[{c:[[40,'DARK MUSCLE']],z:26,b:1,r:1},{c:[[40,'PLAN DE NUTRICIÓN']],z:12,b:1,g:6},{c:[[40,`${GL[P.goal]} · ${t.k} kcal · P ${t.p} g · C ${t.c} g · G ${t.f} g · ${P.meals} comidas`]],g:4},{c:[[40,'Orientativo: no sustituye a un dietista ni a un médico.']],z:8,g:8}];
PLAN.days.forEach((d,i)=>{const s=dt(d);L.push({pb:i%2==0,c:[[40,`DÍA ${i+1}`],[300,`${s.k} kcal · P ${s.p} · C ${s.c} · G ${s.f}`]],z:11,b:1,r:1,g:6});d.meals.forEach(m=>{L.push({c:[[40,`${m.slot}: ${m.title}`.slice(0,78)],[480,m.k+' kcal']],b:1,z:9,g:2});L.push({c:[[52,m.ing.map(ingL).join(' · ').slice(0,118)]],z:8});if(m.sauce)L.push({c:[[52,'Salsa/aliño: '+m.sauce]],z:8})})});
for(let w=0;w<PLAN.days.length/7;w++){L.push({pb:1,c:[[40,'LISTA DE LA COMPRA · SEMANA '+(w+1)]],z:14,b:1,r:1,g:6});const o=shop(w);for(const c in o){L.push({c:[[40,c.toUpperCase()]],b:1,z:9,g:4});o[c].forEach(x=>L.push({c:[[52,dn(x.n)],[300,qty(x)]],z:9}))}}return L}
function mkPdf(Ls){const Pg=[];let c=[],y=790;const nw=()=>{Pg.push(c);c=[];y=790};for(const l of Ls){if(l.pb&&c.length)nw();const z=l.z||9,lh=z*1.5+(l.g||0);if(y-lh<50)nw();y-=lh;for(const[x,t]of l.c)c.push(`BT ${l.b?'/F2':'/F1'} ${z} Tf ${l.r?'0.88 0.02 0':'0 0 0'} rg ${x} ${y.toFixed(1)} Td (${en(t)}) Tj ET`)}Pg.push(c);
let o='%PDF-1.4\n',of=[];const add=(n,b)=>{of[n]=o.length;o+=n+' 0 obj\n'+b+'\nendobj\n'},N=Pg.length;add(1,'<< /Type /Catalog /Pages 2 0 R >>');add(2,`<< /Type /Pages /Count ${N} /Kids [${Pg.map((_,i)=>(6+2*i)+' 0 R').join(' ')}] >>`);add(3,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');add(4,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
Pg.forEach((p,i)=>{const s='0 0 0 rg 0 812 595 30 re f BT /F2 9 Tf 0.88 0.02 0 rg 40 823 Td (DARK MUSCLE  \xB7  NUTRITION) Tj ET\n'+p.join('\n')+`\nBT /F1 8 Tf 0.4 g 40 28 Td (${i+1} / ${N}) Tj ET`;add(5+2*i,`<< /Length ${s.length} >>\nstream\n${s}\nendstream`);add(6+2*i,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${5+2*i} 0 R >>`)});
const Tn=5+2*N,xr=o.length;o+=`xref\n0 ${Tn}\n0000000000 65535 f \n`+of.slice(1).map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${Tn} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;const b=new Uint8Array(o.length);for(let i=0;i<o.length;i++)b[i]=o.charCodeAt(i)&255;return b}
function xp(k){if(!PLAN)return toast('Genera primero una dieta');if(k=='pdf')dl('dark-muscle-dieta.pdf',mkPdf(pdfL()));else if(k=='csv'){const r=[['Día','Comida','Plato','Ingrediente','Gramos','kcal','P','C','G']];PLAN.days.forEach((d,i)=>d.meals.forEach(m=>m.ing.forEach(x=>r.push([i+1,m.slot,m.title,x.n,x.g,x.k,x.p,x.h,x.f]))));dl('dark-muscle-dieta.csv','\uFEFF'+r.map(a=>a.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'))}else dl('dark-muscle-dieta.json',JSON.stringify({app:'DARK MUSCLE NUTRITION',v:1,p:P,plan:PLAN}))}
const NV=['PERFIL','PLAN','COMPRA','ALIMENTOS','EXPORTAR'];
function render(){$('#nv').innerHTML=NV.map((n,i)=>`<button class="${S.tab==i?'on':''}" onclick="S.tab=${i};render();scrollTo(0,0)">${n}</button>`).join('');$('#app').innerHTML=[vPf,vPl,vCo,vAl,vEx][S.tab]();const b=$('#nv .on');if(b)$('#nv').scrollLeft=b.offsetLeft-70}
function rec(m){const o=$('#rec');o.style.display='block';o.innerHTML=`<div class=card><h3>Algo ha fallado</h3><p>Tus datos no se han borrado.</p><textarea rows=4 readonly>${esc('DARK MUSCLE NUTRITION · '+m)}</textarea><button class=btn onclick="location.reload()">RECARGAR</button><button class="btn g" onclick="try{localStorage.removeItem('dmnut.v1')}catch(e){};location.reload()">RESTABLECER DATOS</button></div>`}
window.addEventListener('error',e=>rec(e.message||'error'));window.addEventListener('unhandledrejection',e=>rec(String((e.reason&&e.reason.message)||e.reason)));
render();
</script></body></html>
